
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Proyecto Aris</title>

    <style>

        /* Mensaje de error mostrado debajo del campo de contraseña. */
        .mensaje-error {
            margin-bottom: 10px;
            color: #dc3545;
            font-size: 13px;
        }

        /* Configuración general de la página. */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101c35, #1d3557, #27496d);
        }

        /* Contenedor principal del inicio de sesión. */
        .contenedor-login {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        /* Encabezado de la tarjeta. */
        .encabezado {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 18px;
            border-radius: 15px;
            background-color: #1d3557;
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
        }

        .encabezado h1 {
            color: #1d3557;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .encabezado p {
            color: #7b8794;
            font-size: 14px;
        }

        /* Organización de los campos del formulario. */
        .grupo-campo {
            margin-bottom: 22px;
        }

        .grupo-campo label {
            display: block;
            margin-bottom: 9px;
            color: #344563;
            font-size: 14px;
            font-weight: bold;
        }

        .grupo-campo input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dce2ea;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .grupo-campo input:focus {
            border-color: #315b91;
            box-shadow: 0 0 0 3px rgba(49, 91, 145, 0.12);
        }

        /* Contenedor del campo de contraseña. */
        .contenedor-password {
            position: relative;
        }

        .contenedor-password input {
            padding-right: 65px;
        }

        .boton-mostrar {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #315b91;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        /* Botón principal para iniciar sesión. */
        .boton-login {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background-color: #1d3557;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .boton-login:hover {
            background-color: #315b91;
        }

        /* Pie de la tarjeta. */
        .pie-login {
            margin-top: 28px;
            text-align: center;
            color: #9aa5b1;
            font-size: 12px;
        }

        /* Adaptación para pantallas pequeñas. */
        @media (max-width: 480px) {
            .contenedor-login {
                padding: 30px 24px;
            }

            .encabezado h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- Tarjeta principal de inicio de sesión. -->
    <main class="contenedor-login">

        <!-- Identidad y presentación del sistema. -->
        <header class="encabezado">
            <div class="logo">A</div>

            <h1>Proyecto Aris</h1>

            <p>Ingresa tus credenciales para continuar</p>
        </header>

        <!-- Formulario visual de inicio de sesión. -->
        <form id="formulario-login" action="/login" method="POST">

            <!-- Campo de usuario. -->
            <div class="grupo-campo">
                <!-- Mensaje de error de autenticación. -->
                {% if mensaje_error %}
                    <p class="mensaje-error">{{ mensaje_error }}</p>
                {% endif %}
                <label for="usuario">Usuario</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingresa tu usuario"
                    autocomplete="username"
                    required
                >
            </div>

            <!-- Campo de contraseña. -->
            <div class="grupo-campo">
                <label for="contrasena">Contraseña</label>
                <div class="contenedor-password">
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="boton-mostrar"
                        id="boton-mostrar"
                    >
                        Mostrar
                    </button>
                </div>
            </div>

            <!-- Botón de ingreso. -->
            <button type="submit" class="boton-login">
                Iniciar sesión
            </button>

        </form>

        <!-- Información del sistema. -->
        <footer class="pie-login"> 
            Proyecto Aris © 2026
        </footer>

    </main>

    <script>
        // Obtenemos los elementos del campo de contraseña.
        const campoContrasena = document.getElementById("contrasena");
        const botonMostrar = document.getElementById("boton-mostrar");

        // Permitimos mostrar u ocultar la contraseña.
        botonMostrar.addEventListener("click", function () {

            if (campoContrasena.type === "password") {
                campoContrasena.type = "text";
                botonMostrar.textContent = "Ocultar";
            } else {
                campoContrasena.type = "password";
                botonMostrar.textContent = "Mostrar";
            }

        });

    </script>

</body>
</html>
